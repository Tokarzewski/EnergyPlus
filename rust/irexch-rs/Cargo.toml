[package]
name = "irexch-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `irexch.c`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Export only the `rust_anything_` names, to link beside the original C code.
shadow = []

[dependencies]
intrad-rs = { version = "0.1.0", path = "../intrad-rs" }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
# The exported C ABI keeps the original function and parameter names (IRExchange, L, W) from the irexch.c forwarder.
non_snake_case = "allow"
