[package]
name = "glhe-sim-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `glhesim.c`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Export only the `rust_anything_` names, to link beside the original C code.
shadow = []

[dependencies]
fluidproperties-rs = { version = "0.1.0", path = "../fluidproperties-rs" }
vert-fluid-rs = { version = "0.1.0", path = "../vert-fluid-rs" }
vert-gfunc-rs = { version = "0.1.0", path = "../vert-gfunc-rs" }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
# The exported C ABI keeps the original function and parameter names (GSRun, tsPerHour) from the glhesim.c forwarder.
non_snake_case = "allow"
