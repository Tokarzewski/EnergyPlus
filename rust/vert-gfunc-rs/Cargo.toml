[package]
name = "vert-gfunc-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `vertgfunc.c`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Export only the `rust_anything_` names, to link beside the original C code.
shadow = []

[dependencies]
vert-fluid-rs = { version = "0.1.0", path = "../vert-fluid-rs" }
vert-rs = { version = "0.1.0", path = "../vert-rs" }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
# The exported C ABI keeps the original function and parameter names (VGGFunc, bhLength) from the vertgfunc.c forwarder.
non_snake_case = "allow"
