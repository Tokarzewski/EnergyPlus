[package]
name = "wccdetail-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `wccdetail.c`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Export only the `rust_anything_` names, to link beside the original C code.
shadow = []

[dependencies]
general-rs = { version = "0.1.0", path = "../general-rs" }
psychrometrics-rs = { version = "0.1.0", path = "../psychrometrics-rs" }
watercc-rs = { version = "0.1.0", path = "../watercc-rs" }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
# The exported C ABI keeps the original function and parameter names (WaterCoolDetail, which, mdota) from the wccdetail.c forwarder.
non_snake_case = "allow"
