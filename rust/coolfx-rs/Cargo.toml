[package]
name = "coolfx-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `coolfx.c`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Export only the `rust_anything_` names, to link beside the original C code.
shadow = []

[dependencies]
comfort-rs = { version = "0.1.0", path = "../comfort-rs" }
fanger-rs = { version = "0.1.0", path = "../fanger-rs" }
solveroot-rs = { version = "0.1.0", path = "../solveroot-rs" }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
# The exported C ABI keeps the original function and parameter names (CoolingEffect, outbaro, act) from the coolfx.c forwarder.
non_snake_case = "allow"
